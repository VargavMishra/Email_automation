services:
  api:
    build: .
    command: npm run dev
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/photo_studio_automation
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongodb

  dashboard:
    build:
      context: ./apps/dashboard
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    volumes:
      - ./apps/dashboard:/app
      - /app/node_modules
    depends_on:
      - api

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
